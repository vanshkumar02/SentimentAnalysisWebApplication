
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Sentiment Analysis</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
          rel="stylesheet">
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .signup-form {
            padding: 28px 32px 24px;
            text-align: left;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: #a47551;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .hint {
            font-size: 0.78rem;
            color: #8d6e63;
            text-align: center;
            margin-top: 16px;
            line-height: 1.7;
        }

        .password-note {
            font-size: 0.75rem;
            color: #8d6e63;
            margin-top: 6px;
            line-height: 1.6;
        }

        .error-text {
            color: #c62828;
            background: #fdecea;
            border: 1px solid #f5c2c2;
            border-radius: 8px;
            padding: 10px;
            font-size: 0.82rem;
            text-align: center;
            overflow-wrap: anywhere;
        }

        .signup-heading {
            font-size: 1.25rem;
            font-weight: 500;
            color: #6d4c41;
            text-align: center;
            margin: 0 0 8px;
        }

        .signup-subtitle {
            font-size: 0.82rem;
            color: #8d6e63;
            text-align: center;
            margin-bottom: 24px;
        }

        @media (max-width: 480px) {
            .container {
                width: 90%;
                box-sizing: border-box;
                padding: 0;
            }

            .signup-form {
                padding: 24px 20px;
            }
        }
    </style>
</head>

<body>

    <h1 class="main-heading">Sentiment Analysis Webapp</h1>

    <div class="container">
        <form action="{{ url_for('signup') }}"
              method="POST"
              class="signup-form">

            <h2 class="signup-heading">Create Your Account</h2>
            <p class="signup-subtitle">
                Join us to analyze audio sentiment.
            </p>

            {% if error %}
                <p class="error-text">{{ error }}</p>
            {% endif %}

            <div class="field">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    pattern="^\S+$"
                    title="Username must not contain spaces"
                    autocomplete="username"
                    required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="pw-wrap">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a strong password"
                        pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@$!%*?&]).{8,}"
                        title="Use at least 8 characters, including uppercase, lowercase, a number, and a special character."
                        autocomplete="new-password"
                        required>

                    <span class="eye"
                          onclick="togglePassword()"
                          role="button"
                          tabindex="0"
                          aria-label="Show or hide password">👁</span>
                </div>

                <p class="password-note">
                    At least 8 characters, with an uppercase letter,
                    a lowercase letter, a number, and a special character
                    (@$!%*?&).
                </p>
            </div>

            <button type="submit">Create Account</button>

            <p class="hint">
                Already have an account?
                <a href="{{ url_for('home') }}">Login here</a>
            </p>

        </form>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById("password");
            const eye = document.querySelector(".eye");

            if (input.type === "password") {
                input.type = "text";
                eye.textContent = "🙈";
            } else {
                input.type = "password";
                eye.textContent = "👁";
            }
        }

        document.querySelector(".eye").addEventListener("keydown", function(event) {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                togglePassword();
            }
        });
    </script>

</body>
</html>
